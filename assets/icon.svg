<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <title>Defluff — distillation</title>
  <rect width="128" height="128" rx="28" fill="#1a73e8"/>
  <g fill="#ffffff">
    <!-- Dense block (the fluff): five full-width bars packed tight -->
    <rect x="18" y="32" width="34" height="6" rx="3"/>
    <rect x="18" y="44" width="34" height="6" rx="3"/>
    <rect x="18" y="56" width="34" height="6" rx="3"/>
    <rect x="18" y="68" width="34" height="6" rx="3"/>
    <rect x="18" y="80" width="34" height="6" rx="3"/>
    <rect x="18" y="92" width="34" height="6" rx="3"/>

    <!-- Arrow pointing right — the distillation step -->
    <path d="M 60 62 L 72 62 L 72 56 L 82 64 L 72 72 L 72 66 L 60 66 Z"/>

    <!-- Condensed output: three short varying bullets -->
    <rect x="86" y="50" width="26" height="8" rx="4"/>
    <rect x="86" y="62" width="20" height="8" rx="4"/>
    <rect x="86" y="74" width="14" height="8" rx="4"/>
  </g>
</svg>
